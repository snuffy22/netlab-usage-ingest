[project]
name = "netlab-usage-ingest"
version = "0.1.0"
description = "Privacy-preserving netlab usage ingestion service for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "workers-py",
  "workers-runtime-sdk"
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
