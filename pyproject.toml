[project]
name = "netlab-usage-ingest"
version = "0.1.0"
description = "Privacy-preserving netlab usage ingestion service for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "workers-runtime-sdk>=1.6,<2",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
